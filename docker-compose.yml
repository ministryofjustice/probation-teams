services:
  probation-teams-db:
    image: postgres:15.19
    networks:
      - hmpps
    container_name: probation-teams-db
    restart: always
    ports:
      - '5432:5432'
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=admin_password
      - POSTGRES_DB=probation-teams-db

networks:
  hmpps:
